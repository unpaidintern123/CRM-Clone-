/* ========== Utility Functions ========== */
function formatDateToYMD(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseLeadDateString(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s);
  const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(`${m[3]}-${m[2]}-${m[1]}`) : new Date(s);
}

function getTextWidth(text, font) {
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

function checkTextOverflow(textEl, containerEl) {
  if (!textEl || !containerEl) return false;
  const style = getComputedStyle(textEl), font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  return getTextWidth(textEl.textContent, font) > containerEl.clientWidth - 60;
}

/* ========== Date Helpers ========== */
function getCurrentWeekRange() {
  const today = new Date(), first = today.getDate() - today.getDay(),
        sunday = new Date(today.setDate(first)), saturday = new Date(sunday.getTime() + 6 * 86400000);
  sunday.setHours(0, 0, 0, 0);
  saturday.setHours(23, 59, 59, 999);
  return { start: sunday, end: saturday };
}

function filterByCriteria(start, end, person, city, platform) {
  const inRange = lead => {
    const d = parseLeadDateString(lead["lead date"]);
    return d && d >= start && d <= end;
  };

  const inRangeConsultation = lead => {
    const d = parseLeadDateString(lead["timestamp"]);
    return d && d >= start && d <= end;
  };

  const match = lead => {
    const crmMatch = person ? lead["assigned to"] === person : true;
    const cityMatch = city ? (city === 'Others'
      ? !["Mumbai", "Delhi", "Bangalore"].includes(lead.city)
      : lead.city === city) : true;
    const platformMatch = platform ? lead.platform === platform : true;
    return inRange(lead) && crmMatch && cityMatch && platformMatch;
  };

  const matchConsultation = lead => {
    const crmMatch = person ? lead["assigned to"] === person : true;
    const cityMatch = city ? (city === 'Others'
      ? !["Mumbai", "Delhi", "Bangalore"].includes(lead.city)
      : lead.city === city) : true;
    const platformMatch = platform ? lead.platform === platform : true;
    return inRangeConsultation(lead) && crmMatch && cityMatch && platformMatch;
  };

  return {
    leads: allLeads.filter(match),
    consultations: allConsultations.filter(matchConsultation)
  };
}

/* ========== Funnel Display ========== */
function updateFunnelDisplay() {
  const stages = [
    { id: "funnelNewLeads", bar: "newLeadsBar", internal: "newLeadsInternal", external: "newLeadsExternal" },
    { id: "funnelContacted", bar: "connectedBar", internal: "connectedInternal", external: "connectedExternal" },
    { id: "funnelBooked", bar: "bookedBar", internal: "bookedInternal", external: "bookedExternal" },
    { id: "funnelVisited", bar: "visitedBar", internal: "visitedInternal", external: "visitedExternal" }
  ];

  const values = stages.map(s => parseInt(document.getElementById(s.id)?.textContent) || 0);
  const maxVal = Math.max(...values, 1);

  stages.forEach((s, i) => {
    const width = (values[i] / maxVal) * 100;
    const bar = document.getElementById(s.bar);
    if (bar) bar.style.width = `${width}%`;

    const internal = document.getElementById(s.internal), external = document.getElementById(s.external);
    if (internal && external) {
      if (width > 30) { internal.classList.add("show"); external.classList.remove("show"); }
      else { internal.classList.remove("show"); external.classList.add("show"); }
    }
  });
}

function updateConversionRatios() {

  setText("funnelVisitedConversion", a ? `${Math.round((d / c) * 100)}%` : "0%");
}

/* ========== City Funnel ========== */
function adjustCityFunnels(leads, consultations) {
  const cities = ["Mumbai","Delhi","Bangalore","Others"];
  const stats = cities.reduce((acc, city) => ({ ...acc, [city]: { total:0, booked:0, visited:0 } }), {});

  leads.forEach(l => {
    const c = categorizeCity(l.city);
    stats[c].total++;
    if (l["lead status"] === "Consultation Visited") stats[c].visited++;
  });

  consultations.forEach((cn)=>{
    if(cn["consultation type"] === "In-person"){
      stats["Mumbai"].booked++;
    }else if(cn["consultation type"] === "Delhi (In-person)"){
      stats["Delhi"].booked++
    }else if(cn["consultation type"] === "Bangalore (In-person)"){
      stats["Bangalore"].booked++
    }else{
      stats["Others"].booked++
    }
  });

  cities.forEach(city => {
    const key = city.toLowerCase();
    const { total, booked, visited } = stats[city];
    const bookedPct = total ? (booked / total) * 100 : 0;
    const visitedPct = total ? (visited / total) * 100 : 0;

    setText(`${key}TotalLeads`, total);
    setText(`${key}BookedLeads`, booked);
    setText(`${key}VisitedLeads`, visited);

    const bookedBar = document.getElementById(`${key}BookedBar`);
    const visitedBar = document.getElementById(`${key}VisitedBar`);
    if (bookedBar) bookedBar.style.width = `${Math.max(bookedPct, 15)}%`;
    if (visitedBar) visitedBar.style.width = `${Math.max(visitedPct, 10)}%`;

    toggleCityLabel(`${key}-booked`, bookedPct);
    toggleCityLabel(`${key}-visited`, visitedPct);
  });
}

function categorizeCity(c) {
  if (!c) return "Others";
  const lc = c.toString().toLowerCase();
  if (lc.includes("mumbai") || lc.includes("bombay")) return "Mumbai";
  if (lc.includes("delhi")) return "Delhi";
  if (lc.includes("bangalore") || lc.includes("bengaluru")) return "Bangalore";
  return "Others";
}

function toggleCityLabel(base, pct) {
  const internal = document.querySelector(`.${base}-internal`),
        external = document.querySelector(`.${base}-external`);
  if (internal && external) {
    if (pct < 30 || checkTextOverflow(internal, internal.parentElement.parentElement)) {
      internal.classList.remove("show");
      external.classList.add("show");
    } else {
      internal.classList.add("show");
      external.classList.remove("show");
    }
  }
}

/* ========== Pie Chart ========== */
function createPieChart(leads) {
  const canvas = document.getElementById('pieChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const counts = {};
  leads.forEach(l => {
    const platform = l.platform || 'Unknown';
    counts[platform] = (counts[platform] || 0) + 1;
  });

  const labels = Object.keys(counts),
        data = Object.values(counts),
        colors = ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF','#FF9F40'];

  if (window.leadSourceChart) window.leadSourceChart.destroy();

  window.leadSourceChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors.slice(0, labels.length),
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 12 }, usePointStyle: true }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const label = context.label || '';
              const value = context.raw || 0;
              return `${label}: ${value}`;
            }
          }
        },
        datalabels: {
          display: function(context) {
            const value = context.dataset.data[context.dataIndex];
            const total = context.dataset.data.reduce((a, b) => a + b, 0);
            return (value / total) > 0.15;
          },
          color: '#fff',
          font: { weight: 'bold', size:14 },
          formatter: function(value, context) {
            const label = context.chart.data.labels[context.dataIndex];
            return `${label}: ${value}`;
          }
        }
      }
    },
    plugins: [ChartDataLabels]
  });
}

function getOffsetWeek(offset) {
  const w = getCurrentWeekRange();
  w.start.setDate(w.start.getDate() + offset * 7);
  w.end.setDate(w.end.getDate() + offset * 7);
  return w;
}

function getSingleDate(offset) {
  const d = new Date(); d.setDate(d.getDate()+offset);
  d.setHours(0,0,0,0); const e = new Date(d); e.setHours(23,59,59,999);
  return { start: d, end: e };
}

function getMonthRange(offset) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth() + offset;
  const s = new Date(y, m, 1, 0,0,0,0), e = new Date(y, m+1, 0, 23,59,59,999);
  return { start: s, end: e };
}
