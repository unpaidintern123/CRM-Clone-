function isLeadPriorityMatch(lead, selectedPriority) {
  if (selectedPriority === "") return true;
  return lead["lead label"] === selectedPriority;
}

// Recomputes all stage counts (All / New Lead / Follow Stage / Consultation Booked /
// Consultation Visited / Lost) using the same active filters as the card list, so the
// non-active stage buttons never keep stale overall counts. Mirrors each stage's
// existing per-branch predicate above; no counts are hard-coded.
function refreshAllStageCounts(cityVal, statusVal, platformVal, priorityVal, contactNoVal, dateFilterVal, orderStatutsVal, startDate, endDate) {
  const priorityFilteredLeadData = allLeadData.filter(lead => isLeadPriorityMatch(lead, priorityVal));
  const isAllStageActive = document.querySelector(".stage-btn.active")?.classList.contains("all-stage");
  const hasRange = startDate instanceof Date && !isNaN(startDate) && endDate instanceof Date && !isNaN(endDate);
  const mine = lead => lead["assigned to"] === loggedUser.username;
  const cityOf = lead => cityVal === "" || (lead["city"] && lead["city"].toString().toLowerCase().includes(cityVal));
  const platformOf = lead => platformVal === "" || (lead["platform"] && lead["platform"].toLowerCase() === platformVal);
  const statusOf = lead => statusVal === "" || (lead["lead status"] && lead["lead status"].toLowerCase() === statusVal);
  const rangeOf = leadDate => hasRange ? (leadDate >= startDate && leadDate <= endDate) : true;

  // New Lead
  newLeadBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const isDateMatch = rangeOf(new Date(lead["lead date"]));
    return lead["lead status"] === "New Lead" && mine(lead) && isDateMatch && cityOf(lead) && platformOf(lead) && isLeadPriorityMatch(lead, priorityVal);
  }).length;

  // Follow Up Stage
  followupBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const leadDate = new Date(lead["follow up date"]);
    let isDateMatch;
    if (isAllStageActive) {
      isDateMatch = true;
    } else if (dateFilterVal === "Today") {
      const todayStartD = new Date(new Date().toISOString().split('T')[0] + "T00:00:00");
      const todayEndD = new Date(new Date().toISOString().split('T')[0] + "T23:59:00");
      isDateMatch = leadDate >= todayStartD && leadDate <= todayEndD;
    } else if (dateFilterVal === "Past") {
      const todayStartD = new Date(new Date().toISOString().split('T')[0] + "T00:00:00");
      isDateMatch = leadDate <= todayStartD;
    } else {
      isDateMatch = rangeOf(leadDate);
    }
    return ["Warm Lead", "Cold Lead 1", "Cold Lead 2", "Deferred Lead", "Ringing / Busy", "Not Reachable"].includes(lead["lead status"]) && mine(lead) && isDateMatch && cityOf(lead) && statusOf(lead) && platformOf(lead) && isLeadPriorityMatch(lead, priorityVal);
  }).length;

  // Consultation Booked
  consultationBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const isDateMatch = rangeOf(new Date(lead["consultation booked date"]));
    return ["Consultation Booked"].includes(lead["lead status"]) && mine(lead) && isDateMatch && cityOf(lead) && platformOf(lead) && isLeadPriorityMatch(lead, priorityVal);
  }).length;

  // Consultation Visited
  consultationVisitedBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const isDateMatch = rangeOf(new Date(lead["consultation visited date"]));
    const isOrderStatusMatched = orderStatutsVal === "" ? true : orderStatutsVal === "not filled" ? (lead["order booked status"] === "") : (lead["order booked status"].trim().toLowerCase() === orderStatutsVal);
    return lead["lead status"] === "Consultation Visited" && mine(lead) && isDateMatch && cityOf(lead) && platformOf(lead) && isOrderStatusMatched && isLeadPriorityMatch(lead, priorityVal);
  }).length;

  // Lost
  lostBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const isDateMatch = rangeOf(new Date(lead["follow up date"]));
    return ["Lost", "Dead", "Not Visited Lost"].includes(lead["lead status"]) && mine(lead) && isDateMatch && cityOf(lead) && statusOf(lead) && platformOf(lead) && isLeadPriorityMatch(lead, priorityVal);
  }).length;

  // All
  allBtn.querySelector(".count").textContent = priorityFilteredLeadData.filter(lead => {
    const isContactMatch = contactNoVal === 0 || contactNoVal === "" || lead["mobile no"] == contactNoVal;
    return mine(lead) && cityOf(lead) && isContactMatch && platformOf(lead) && isLeadPriorityMatch(lead, priorityVal);
  }).length;
}
