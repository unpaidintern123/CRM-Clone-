// Date and time function 

function formatDate(input) {
  const date = new Date(input);
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", 
                  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  return `${date.getDate().toString().padStart(2, '0')} ${
           months[date.getMonth()]
         } ${date.getFullYear()} ${
           date.getHours().toString().padStart(2, '0')}:${
           date.getMinutes().toString().padStart(2, '0')}:${
           date.getSeconds().toString().padStart(2, '0')}`;
}

// Change Dates from UTC to IST

function toLocalISOString(date) {
  if (!(date instanceof Date) || isNaN(date)) return "";

  const offsetInMinutes = date.getTimezoneOffset(); // For IST, this will be -330
  const localDate = new Date(date.getTime() - offsetInMinutes * 60000);
  return localDate.toISOString().slice(0, 16);
}

function toLocalDateOnlyString(date) {
  if (!(date instanceof Date) || isNaN(date)) return "";

  const offsetInMinutes = date.getTimezoneOffset();
  const localDate = new Date(date.getTime() - offsetInMinutes * 60000);

  const day = String(localDate.getDate()).padStart(2, '0');
  const month = String(localDate.getMonth() + 1).padStart(2, '0');
  const year = localDate.getFullYear();

  return `${year}-${month}-${day}`;
}

// Function to get the relevent Lead Date

function getRelevantDate(lead) {
  return (
    lead["lead status"] === "New Lead" ? lead["lead date"] :
    ["Warm Lead", "Cold Lead 1", "Cold Lead 2", "Deferred Lead", "Ringing / Busy","Not Reachable"].includes(lead["lead status"]) ? lead["follow up date"] :
    ["Lost", "Dead","Not Visited Lost"].includes(lead["lead status"]) ? lead["follow up date"] :
    lead["lead status"] === "Consultation Booked" ? lead["consultation booked date"] :
    lead["consultation visited date"]
  );
}


 // ✅ Sort by lead date descending (latest first)

      ["Warm Lead", "Cold Lead 1", "Cold Lead 2", "Deferred Lead", "Ringing / Busy","Not Reachable"].includes(lead["lead status"]) ? "follow" :

      lead["lead status"] === "Consultation Booked" ? "booked" : "visited"
    );

    const priorityClass = getLeadPriorityClass(lead["lead label"]);

      <div class="lead-card ${priorityClass}" data-index="${index}" data-id="${lead["lead unique id"]}">

        <div class="lead-info">${phone}</div>

        <div class="lead-info">${label}${formatDate(dateForLead)}</div>

    `;

      leadCards.forEach(c => c.classList.remove("active"));

      this.classList.add("active");

    });

function getLeadPriorityClass(priorityValue) {
  const normalizedPriority = (priorityValue || "").toString().trim().toLowerCase();
  const priorityMap = {
    high: "priority-high",
    medium: "priority-medium",
    low: "priority-low"
  };

  return priorityMap[normalizedPriority] || "";
}

const leadPriorityEl = document.getElementById("leadPriority");
const leadPriorityConfirmBtn = document.getElementById("leadPriorityConfirm");
const leadPriorityCancelBtn = document.getElementById("leadPriorityCancel");
const leadPriorityControl = document.querySelector(".lead-priority-control");
// Holds an unsaved priority selection until the user confirms (✓) or cancels (✕).
let leadPriorityPending = null;

function setLeadPriorityCardClass(leadUniqueId, priorityValue) {
  const card = document.querySelector(`.lead-card[data-id="${leadUniqueId}"]`);
  if (!card) return;
  card.classList.remove("priority-high", "priority-medium", "priority-low");
  const priorityClass = getLeadPriorityClass(priorityValue);
  if (priorityClass) card.classList.add(priorityClass);
}

function clearLeadPriorityPending() {
  leadPriorityPending = null;
  leadPriorityConfirmBtn.classList.remove("is-visible");
  leadPriorityCancelBtn.classList.remove("is-visible");
  leadPriorityConfirmBtn.disabled = false;
  leadPriorityCancelBtn.disabled = false;
  leadPriorityControl.classList.remove("confirm-high", "confirm-medium", "confirm-low");
}

leadPriorityEl.addEventListener("change", function() {
  const leadUniqueId = document.getElementById("leadUniqueId").value;
  if (!leadUniqueId) return;

  const selectedPriority = this.value;
  const selectedLead = allLeadData.find(lead => lead["lead unique id"] === leadUniqueId);
  const previousPriority = leadPriorityPending
    ? leadPriorityPending.previousPriority
    : (selectedLead ? (selectedLead["lead label"] || "") : "");

  if (selectedPriority === previousPriority) {
    clearLeadPriorityPending();
    setLeadPriorityCardClass(leadUniqueId, previousPriority);
    return;
  }

  // Temporary preview only — the Google Sheet is NOT updated until ✓ is clicked.
  leadPriorityPending = { leadUniqueId, previousPriority, selectedPriority };
  setLeadPriorityCardClass(leadUniqueId, selectedPriority);
  leadPriorityConfirmBtn.classList.add("is-visible");
  leadPriorityCancelBtn.classList.add("is-visible");
  leadPriorityControl.classList.remove("confirm-high", "confirm-medium", "confirm-low");
});

leadPriorityConfirmBtn.addEventListener("click", function() {
  if (!leadPriorityPending) return;
  const { leadUniqueId, previousPriority, selectedPriority } = leadPriorityPending;
  const selectedLead = allLeadData.find(lead => lead["lead unique id"] === leadUniqueId);

  const base = getLeadPriorityClass(selectedPriority);
  if (base) leadPriorityControl.classList.add(base.replace("priority-", "confirm-"));
  leadPriorityConfirmBtn.disabled = true;
  leadPriorityCancelBtn.disabled = true;

  crmApi.invokeGas("updateLeadPriority", { leadUniqueId, selectedPriority })
    .then(() => {
      if (selectedLead) selectedLead["lead label"] = selectedPriority;
      setLeadPriorityCardClass(leadUniqueId, selectedPriority);
      clearLeadPriorityPending();
    })
    .catch(() => {
      if (selectedLead) selectedLead["lead label"] = previousPriority;
      leadPriorityEl.value = previousPriority;
      setLeadPriorityCardClass(leadUniqueId, previousPriority);
      clearLeadPriorityPending();
      alert("Unable to update Lead Priority. Please try again.");
    });
});

leadPriorityCancelBtn.addEventListener("click", function() {
  if (!leadPriorityPending) return;
  const { leadUniqueId, previousPriority } = leadPriorityPending;
  leadPriorityEl.value = previousPriority;
  setLeadPriorityCardClass(leadUniqueId, previousPriority);
  clearLeadPriorityPending();
});

function updateStageCounts() {
  newLeadBtn.querySelector(".count").textContent =
    allLeadData.filter(lead => lead["lead status"] === "New Lead" && lead["assigned to"] === loggedUser.username).length;

  followupBtn.querySelector(".count").textContent =
    allLeadData.filter(lead => {
const leadDate = new Date(lead["follow up date"]);
       let isDateMatch = null;
      const dateFilterVal = document.getElementById("dateFilter").value;
        if(dateFilterVal === "Today"){
          const todayStartD = new Date(new Date().toISOString().split('T')[0] + "T00:00:00");
          const todayEndD = new Date(new Date().toISOString().split('T')[0] + "T23:59:00");
          isDateMatch = leadDate >= todayStartD && leadDate <= todayEndD;
          }else if(dateFilterVal === "Past") {
              const todayStartD = new Date(new Date().toISOString().split('T')[0] + "T00:00:00");
              const todayEndD = new Date(new Date().toISOString().split('T')[0] + "T23:59:00");
              isDateMatch = leadDate <= todayStartD;
          }else {
              isDateMatch = true;
          }

      return isDateMatch && ["Warm Lead", "Cold Lead 1", "Cold Lead 2", "Deferred Lead", "Ringing / Busy","Not Reachable"]
        .includes(lead["lead status"]) && lead["assigned to"] === loggedUser.username}).length;

  consultationBtn.querySelector(".count").textContent =
    allLeadData.filter(lead => lead["lead status"] === "Consultation Booked" && lead["assigned to"] === loggedUser.username).length;

  consultationVisitedBtn.querySelector(".count").textContent =
    allLeadData.filter(lead => lead["lead status"] === "Consultation Visited" && lead["assigned to"] === loggedUser.username).length;

// Get all necessary elements
const leadStatusSelect = document.getElementById('leadStatus');
const postConsultationSection = document.getElementById('postConsultationSection');

const orderStatusNotBooked = document.getElementById("orderNotBooked");
const totalSalesAmount = document.getElementById("totalSalesAmount");
const notBookedFeedback = document.getElementById("notBookedFeedback");
const orderDate = document.getElementById("orderDate");

// Show/Hide Post-Consultation Section based on Lead Status
if (leadStatusSelect) {
    leadStatusSelect.addEventListener('change', function() {
        orderStatusBooked.removeAttribute("required");
        orderStatusNotBooked.removeAttribute("required");
        totalSalesAmount.removeAttribute("required");
        notBookedFeedback.removeAttribute("required");
        orderDate.removeAttribute("required");
        const selectedStatus = this.value;
        
        if (selectedStatus === 'Consultation Visited' || selectedStatus === 'Order Booked' || selectedStatus === 'Not Booked Follow up') {
            postConsultationSection.classList.remove('hide');
            postConsultationSection.classList.add('animate-in');
            orderStatusBooked.setAttribute("required","true");
            orderStatusNotBooked.setAttribute("required","true");
        } else {
            postConsultationSection.classList.add('hide');
            // Reset the form when hidden
            // resetPostConsultationForm();
        }
    });
}

// Handle Order Status Radio Selection
orderStatusRadios.forEach(radio => {
    radio.addEventListener('change', function() {
        const selectedValue = this.value;
        
        if (selectedValue === 'Booked') {
            // Show Booked Section
            bookedSection.classList.remove('hide');
            bookedSection.classList.add('animate-in');
            
            // Hide Not Booked Section
            notBookedSection.classList.add('hide');
            totalSalesAmount.setAttribute("required","true"); 
            notBookedFeedback.removeAttribute("required");
            orderDate.setAttribute("required","true");
            
            // Clear Not Booked fields
            // clearNotBookedFields();
            
        } else if (selectedValue === 'Not Booked') {
            // Show Not Booked Section
            notBookedSection.classList.remove('hide');
            notBookedSection.classList.add('animate-in');
            
            // Hide Booked Section
            bookedSection.classList.add('hide');
            notBookedFeedback.setAttribute("required","true");
            totalSalesAmount.removeAttribute("required");
            orderDate.removeAttribute("required");
            
            // Clear Booked fields
            // clearBookedFields();
        }
    });
});

// Clear Booked Section Fields
function clearBookedFields() {
    document.getElementById('totalSalesAmount').value = '';
    orderDate.value = '';
}

// Clear Not Booked Section Fields
function clearNotBookedFields() {
    document.getElementById('notBookedFeedback').value = '';

}

// Reset entire Post-Consultation Form
function resetPostConsultationForm() {
    // Reset radio selection
    orderStatusRadios.forEach(radio => radio.checked = false);
    
    // Hide both sections
    bookedSection.classList.add('hide');
    notBookedSection.classList.add('hide');
    
    // Clear all fields
    clearBookedFields();
    clearNotBookedFields();
}

// Number validation for amount fields
const numberInputs = document.querySelectorAll('input[type="number"]');
numberInputs.forEach(input => {
    input.addEventListener('input', function() {
        // Prevent negative values
        if (this.value < 0) {
            this.value = 0;
        }
        
        // For noOfOrders, ensure it's an integer
        if (this.id === 'noOfOrders' && this.value) {
            this.value = Math.floor(this.value);
        }
    });
});

// Add visual feedback for filled inputs
const allInputs = document.querySelectorAll('.animated-input, .animated-select');
allInputs.forEach(input => {
    input.addEventListener('change', function() {
        if (this.value) {
            this.style.borderColor = '#58B1A5';
            this.style.backgroundColor = 'rgba(88, 177, 165, 0.05)';
        } else {
            this.style.borderColor = '#e0e0e0';
            this.style.backgroundColor = 'white';
        }
    });
});
