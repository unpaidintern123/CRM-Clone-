                            <span class="eye-closed" style="display: none;">👁️‍🗨️</span>
                        </button>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.querySelector('.eye-open');
            const eyeClosed = document.querySelector('.eye-closed');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'inline';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'inline';
                eyeClosed.style.display = 'none';
            }
        }

        // Handle login form submission
        const loginForm = document.querySelector(".login-form"); 
        const loginDetails = document.querySelectorAll(".loginDetails")
        const loginInfo = document.querySelector(".loginInfo");
        const loginButton = document.querySelector(".login-btn");
        const loginDetailsBack = {}
        loginForm.addEventListener("submit",(e)=>{
        e.preventDefault();
        
        // Show loading spinner
        const btnText = document.querySelector('.btn-text');
        const spinner = document.querySelector('.spinner');
        btnText.style.display = 'none';
        spinner.style.display = 'block';
        
        loginDetails.forEach((element,index)=>{
        loginDetailsBack[element.name] = element.value;
        });
        loginButton.disabled = true;
        crmApi.invokeGas("checkLogin", loginDetailsBack).then(onSuccess).catch((err) => {
          console.error(err);
          loginInfo.textContent = "Login failed";
          loginInfo.style.display = "block";
          loginButton.disabled = false;
          btnText.style.display = 'inline';
          spinner.style.display = 'none';
        });
        })

   function onSuccess(response) {
    const parsedData = JSON.parse(response);
    const btnText = document.querySelector('.btn-text');
    const spinner = document.querySelector('.spinner');
    const loginInfo = document.querySelector(".loginInfo");

    if(parsedData.message === "Login Successful"){
        localStorage.setItem("loggedInUser",JSON.stringify(parsedData.user));
        loginInfo.textContent = parsedData.message;
        loginInfo.style.display = "block";
        loginInfo.className = "loginInfo " + (parsedData.message === "Login Successful" ? "success" : "error");

        // Only proceed with redirection after a user action (button click)
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        
        // Use a user-triggered event to navigate
        window.open(parsedData.link, '_blank'); // or window.top.location.href
        // setTimeout(()=>{
        //   window.top.location.href = parsedData.link;
        // },1000)
        
    } else {
        loginInfo.textContent = parsedData.message;
        loginInfo.style.display = "block";
        loginInfo.className = "loginInfo " + (parsedData.message === "Login Successful" ? "success" : "error");
        loginButton.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
    }
    return response;
}


        // Add input animation
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.parentElement.classList.remove('focused');
                }
            });
        });
    </script>
